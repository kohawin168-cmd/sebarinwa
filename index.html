<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Promo Blast WhatsApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
</head>
<body class="bg-light">
  <div class="container py-5 text-center">
    <h1 class="mb-4">Promo Blast WhatsApp (Legal Version)</h1>

    <div class="card shadow p-4 mx-auto" style="max-width: 500px;">
      <h5 class="mb-3">Kirim Pesan Promo</h5>

      <div class="mb-3">
        <label for="whatsappNumber" class="form-label">Nomor WhatsApp Tujuan</label>
        <input type="tel" id="whatsappNumber" class="form-control" placeholder="Contoh: 6281234567890" required>
      </div>

      <div class="mb-3">
        <label for="message" class="form-label">Pesan (maks. 500 karakter)</label>
        <textarea id="message" class="form-control" maxlength="500" rows="4"
          placeholder="Tulis pesan promo kamu di sini..."></textarea>
      </div>

      <button id="sendBtn" class="btn btn-success w-100">Kirim ke WhatsApp</button>

      <hr class="my-4">

      <h6>Login WhatsApp Web</h6>
      <div id="qrcode" class="d-flex justify-content-center my-3"></div>
      <p class="text-muted small">Scan barcode ini untuk membuka <a href="https://web.whatsapp.com" target="_blank">WhatsApp Web</a>.</p>
    </div>
  </div>

  <script>
    // Generate QR Code menuju WhatsApp Web
    new QRCode(document.getElementById("qrcode"), {
      text: "https://web.whatsapp.com/",
      width: 150,
      height: 150
    });

    // Kirim pesan manual via link resmi
    document.getElementById("sendBtn").addEventListener("click", function() {
      const phone = document.getElementById("whatsappNumber").value.trim();
      const message = encodeURIComponent(document.getElementById("message").value.trim());
      
      if (!phone || !message) {
        alert("Nomor dan pesan wajib diisi!");
        return;
      }

      const url = `https://wa.me/${phone}?text=${message}`;
      window.open(url, "_blank");
    });
  </script>
</body>
</html>

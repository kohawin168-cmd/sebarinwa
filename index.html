<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MINI ATM</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#f2f4f7;margin:0}
    header{background:#0d6efd;color:#fff;padding:16px;text-align:center}
    .container{padding:12px 12px 70px}
    .card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
    h3{margin:0 0 10px}
    input,select,button{width:100%;padding:10px;margin-top:6px;border-radius:10px;border:1px solid #ccc}
    button{background:#0d6efd;color:#fff;border:none;font-weight:600}
    button.secondary{background:#198754}
    ul{padding-left:18px}
    .nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #ddd}
    .nav button{flex:1;border-radius:0}
    .hidden{display:none}
    .small{font-size:13px;color:#555}
  </style>
</head>
<body>
<header>
  <h2>MINI ATM</h2>
  <div id="totalAset">Total Aset: Rp 0</div>
</header><div class="container"><!-- BERANDA --><div id="page-beranda">
  <div class="card">
    <h3>Uang Laci</h3>
    <input type="number" id="uangLaci" placeholder="Masukkan uang laci" />
    <button onclick="simpanLaci()">Simpan</button>
  </div>  <div class="card">
    <h3>Akun Bank</h3>
    <input id="namaBank" placeholder="Nama Bank" />
    <input type="number" id="saldoBank" placeholder="Saldo Awal" />
    <button onclick="tambahBank()">Tambah Akun Bank</button>
    <ul id="listBank"></ul>
  </div>
</div><!-- TRANSAKSI --><div id="page-transaksi" class="hidden">
  <div class="card">
    <h3>Input Transaksi</h3><select id="jenisTransaksi">
  <option value="TRANSFER">Transfer</option>
  <option value="TARIK_EDC">Tarik Tunai EDC</option>
  <option value="TARIK_NON_EDC">Tarik Tunai Non EDC</option>
</select>

<select id="bankDipakai"></select>

<input type="number" id="jumlah" placeholder="Jumlah Transaksi" />
<input id="bankTujuan" placeholder="Bank Tujuan (manual)" />
<input type="number" id="admin" placeholder="Admin (ke laci)" />
<input type="number" id="fee" placeholder="Fee Bank" />

<button onclick="simpanTransaksi()">Simpan Transaksi</button>

  </div>  <div class="card">
    <h3>Laporan</h3>
    <div class="small" id="infoLaci"></div>
    <div class="small" id="infoBank"></div>
    <hr />
    <button class="secondary" onclick="exportExcel()">Export Excel</button>
    <button onclick="shareWA()">Share WhatsApp</button>
    <div id="laporan"></div>
  </div>
</div></div><div class="nav">
  <button onclick="showPage('beranda')">Beranda</button>
  <button onclick="showPage('transaksi')">Transaksi</button>
</div><script>
let data = JSON.parse(localStorage.getItem('miniATM')) || { laci:0, bank:[], trx:[] };

function save(){
  localStorage.setItem('miniATM', JSON.stringify(data));
  render();
}

function hitungAset(){
  let totalBank = data.bank.reduce((a,b)=>a+b.saldo,0);
  document.getElementById('totalAset').innerText = 'Total Aset: Rp ' + (totalBank + data.laci);
}

function simpanLaci(){
  data.laci = Number(uangLaci.value);
  save();
}

function tambahBank(){
  if(!namaBank.value) return;
  data.bank.push({nama:namaBank.value, saldo:Number(saldoBank.value)});
  namaBank.value=''; saldoBank.value='';
  save();
}

function simpanTransaksi(){
  let idx = bankDipakai.value;
  let bank = data.bank[idx];
  let jumlah = Number(document.getElementById('jumlah').value);
  let admin = Number(document.getElementById('admin').value);
  let fee = Number(document.getElementById('fee').value);
  let jenis = jenisTransaksi.value;

  let saldoAwal = bank.saldo;

  // LOGIKA TRANSAKSI
  if(jenis === 'TRANSFER'){
    // Transfer
    data.laci += (jumlah + admin);
    bank.saldo = bank.saldo - jumlah - fee;
  }else{
    // Tarik Tunai (EDC / NON EDC)
    data.laci -= jumlah;
    bank.saldo = bank.saldo + jumlah + admin + fee;
  }

  let laba = admin - fee;

  data.trx.push({
    jenis,
    bank: bank.nama,
    tujuan: bankTujuan.value,
    jumlah,
    admin,
    fee,
    laba,
    saldoAwal,
    saldoAkhir: bank.saldo
  });

  save();
}

function render(){
  listBank.innerHTML = data.bank.map(b=>`<li>${b.nama} : Rp ${b.saldo}</li>`).join('');
  bankDipakai.innerHTML = data.bank.map((b,i)=>`<option value="${i}">${b.nama}</option>`).join('');

  laporan.innerHTML = data.trx.map(t=>
    `<div>• ${t.jenis} | ${t.bank} | ${t.saldoAwal} ➜ ${t.saldoAkhir}</div>`
  ).join('');

  infoLaci.innerText = 'Uang Laci: Rp ' + data.laci;
  infoBank.innerText = 'Total Bank: Rp ' + data.bank.reduce((a,b)=>a+b.saldo,0);

  hitungAset();
}

function exportExcel(){
  let csv='Jenis,Bank,Tujuan,Jumlah,Admin,Fee,Laba,Saldo Awal,Saldo Akhir
';
  data.trx.forEach(t=>{
    csv+=`${t.jenis},${t.bank},${t.tujuan},${t.jumlah},${t.admin},${t.fee},${t.laba},${t.saldoAwal},${t.saldoAkhir}
`;
  });
  let blob=new Blob([csv],{type:'text/csv'});
  let a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='laporan-mini-atm.csv';
  a.click();
}

function shareWA(){
  let text=data.trx.map(t=>`${t.jenis} ${t.bank} Saldo Akhir: ${t.saldoAkhir}`).join('%0A');
  window.open('https://wa.me/?text='+text);
}

function showPage(p){
  document.getElementById('page-beranda').classList.add('hidden');
  document.getElementById('page-transaksi').classList.add('hidden');
  document.getElementById('page-'+p).classList.remove('hidden');
}

render();
</script></body>
</html>

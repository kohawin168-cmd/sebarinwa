<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MINI ATM</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f6f8; margin:0; }
    header { background:#0d6efd; color:#fff; padding:16px; text-align:center; }
    .container { padding:12px; }
    .card { background:#fff; border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 2px 6px rgba(0,0,0,.1); }
    h3 { margin-top:0; }
    input, select, button { width:100%; padding:10px; margin-top:6px; border-radius:8px; border:1px solid #ccc; }
    button { background:#0d6efd; color:#fff; border:none; font-weight:bold; }
    button.secondary { background:#198754; }
    .row { display:flex; gap:8px; }
    .row > div { flex:1; }
    .nav { position:fixed; bottom:0; left:0; right:0; background:#fff; display:flex; border-top:1px solid #ddd; }
    .nav button { flex:1; border-radius:0; }
    .hidden { display:none; }
  </style>
</head>
<body>
<header>
  <h2>MINI ATM</h2>
  <div id="totalAset">Total Aset: Rp 0</div>
</header><div class="container">  <div id="page-beranda">
    <div class="card">
      <h3>Uang Laci</h3>
      <input type="number" id="uangLaci" placeholder="Uang Laci" />
      <button onclick="simpanUangLaci()">Simpan</button>
    </div><div class="card">
  <h3>Akun Bank</h3>
  <input id="namaBank" placeholder="Nama Bank" />
  <input type="number" id="saldoBank" placeholder="Saldo Awal" />
  <button onclick="tambahBank()">Tambah Akun Bank</button>
  <ul id="listBank"></ul>
</div>

  </div>  <div id="page-transaksi" class="hidden">
    <div class="card">
      <h3>Transaksi</h3>
      <select id="jenisTransaksi">
        <option value="Transfer">Transfer</option>
        <option value="Tarik Tunai EDC">Tarik Tunai EDC</option>
        <option value="Tarik Tunai Non EDC">Tarik Tunai Non EDC</option>
      </select><select id="bankDipakai"></select>
  <input type="number" id="jumlah" placeholder="Jumlah" />
  <input id="bankTujuan" placeholder="Bank Tujuan (manual)" />
  <input type="number" id="admin" placeholder="Admin" />
  <input type="number" id="fee" placeholder="Fee" />
  <button onclick="simpanTransaksi()">Simpan Transaksi</button>
</div>

<div class="card">
  <h3>Laporan</h3>
  <button class="secondary" onclick="exportExcel()">Export Excel</button>
  <button onclick="shareWA()">Share WhatsApp</button>
  <div id="laporan"></div>
</div>

  </div></div><div class="nav">
  <button onclick="showPage('beranda')">Beranda</button>
  <button onclick="showPage('transaksi')">Transaksi</button>
</div><script>
let data = JSON.parse(localStorage.getItem('miniATM')) || { bank:[], laci:0, trx:[] };

function save(){ localStorage.setItem('miniATM', JSON.stringify(data)); hitungAset(); render(); }

function hitungAset(){
  let totalBank = data.bank.reduce((a,b)=>a+b.saldo,0);
  document.getElementById('totalAset').innerText = 'Total Aset: Rp ' + (totalBank + data.laci);
}

function simpanUangLaci(){ data.laci = Number(uangLaci.value); save(); }

function tambahBank(){
  data.bank.push({ nama:namaBank.value, saldo:Number(saldoBank.value) });
  namaBank.value=''; saldoBank.value=''; save();
}

function simpanTransaksi(){
  let idx = bankDipakai.value;
  let jumlah = Number(document.getElementById('jumlah').value);
  let admin = Number(document.getElementById('admin').value);
  let fee = Number(document.getElementById('fee').value);

  let bank = data.bank[idx];
  let saldoAwal = bank.saldo;
  bank.saldo = bank.saldo - jumlah - admin + fee;

  data.trx.push({ jenis:jenisTransaksi.value, jumlah, admin, fee, bank:bank.nama, saldoAwal, saldoAkhir:bank.saldo });
  save();
}

function render(){
  listBank.innerHTML = data.bank.map(b=>`<li>${b.nama} : Rp ${b.saldo}</li>`).join('');
  bankDipakai.innerHTML = data.bank.map((b,i)=>`<option value="${i}">${b.nama}</option>`).join('');
  laporan.innerHTML = data.trx.map(t=>`<div>${t.jenis} | ${t.bank} | ${t.saldoAwal} ➜ ${t.saldoAkhir}</div>`).join('');
}

function exportExcel(){
  let csv = 'Jenis,Bank,Jumlah,Admin,Fee,Saldo Awal,Saldo Akhir\n';
  data.trx.forEach(t=>{ csv+=`${t.jenis},${t.bank},${t.jumlah},${t.admin},${t.fee},${t.saldoAwal},${t.saldoAkhir}\n`; });
  let blob = new Blob([csv],{type:'text/csv'});
  let a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='laporan-mini-atm.csv'; a.click();
}

function shareWA(){
  let text = data.trx.map(t=>`${t.jenis} ${t.bank} Saldo Akhir: ${t.saldoAkhir}`).join('%0A');
  window.open('https://wa.me/?text='+text);
}

function showPage(p){
  document.getElementById('page-beranda').classList.add('hidden');
  document.getElementById('page-transaksi').classList.add('hidden');
  document.getElementById('page-'+p).classList.remove('hidden');
}

render(); hitungAset();
</script></body>
</html>
